<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manual</title>
<style>
  :root{
    --deep:#0B4F6C; --aqua:#0FA3B1; --ink:#10222B; --muted:#5D7480; --line:#D6E2E6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--ink);max-width:680px;margin:0 auto;padding:30px 24px;
  }
  @page{size:A4;margin:16mm}
  .header-row{display:flex;align-items:center;gap:16px}
  .header-row .logo{flex:none;width:54px;height:54px;border-radius:14px}
  .eyebrow{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--aqua);font-weight:700;margin-bottom:4px;
  }
  h1{font-size:1.6rem;font-weight:800;color:var(--deep);line-height:1.15}
  .rule{height:6px;margin:16px 0 26px;
    background:repeating-linear-gradient(-45deg,var(--aqua) 0 12px,transparent 12px 24px);
    opacity:.85;border-radius:3px;
  }

  .qr-wrap{text-align:center;margin-bottom:30px}
  .qr-wrap h2{
    font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--deep);font-weight:800;margin-bottom:14px;
  }
  .qr-wrap img{width:210px;height:auto;image-rendering:pixelated}

  .steps h2{
    font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--deep);font-weight:800;margin-bottom:18px;
  }
  .steps ol{list-style:none;counter-reset:step}
  .steps li{
    position:relative;padding:0 0 22px 46px;counter-increment:step;
    font-size:.98rem;line-height:1.5;
  }
  .steps li::before{
    content:counter(step);
    position:absolute;left:0;top:-3px;width:30px;height:30px;border-radius:50%;
    background:var(--deep);color:#fff;font-weight:800;font-size:.9rem;
    display:flex;align-items:center;justify-content:center;
  }
  .steps li::after{
    content:"";position:absolute;left:14px;top:29px;bottom:2px;width:2px;
    background:var(--line);
  }
  .steps li:last-child{padding-bottom:0}
  .steps li:last-child::after{display:none}

  .report-hint{
    margin-top:24px;background:#E8F6F7;border:1px solid var(--aqua);border-radius:12px;
    padding:12px 16px;font-size:.85rem;line-height:1.5;color:var(--deep);
  }

  /* Discreet spot for a standard round NFC sticker (~25 mm) */
  .nfc-spot{
    position:fixed;right:6mm;bottom:6mm;width:30mm;height:30mm;border-radius:50%;
    border:1.5px dashed var(--muted);opacity:.55;
    display:flex;align-items:center;justify-content:center;
    font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--muted);
  }

  .print-button{
    position:fixed;right:18px;top:18px;background:var(--deep);color:#fff;border:none;
    border-radius:12px;padding:12px 22px;font-size:.95rem;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  @media print{.print-button{display:none}}
</style>
</head>
<body>

<button class="print-button" id="print" onclick="window.print()"></button>

<div class="header-row">
  <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="#0B4F6C"/>
    <path d="M76 114l36 36 70-72" stroke="#FFFFFF" stroke-width="24" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 184q16-14 32 0t32 0t32 0t32 0t32 0" stroke="#0FA3B1"
          stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M60 212q16-11 32 0t32 0t32 0t32 0" stroke="#0FA3B1" stroke-width="11"
          fill="none" stroke-linecap="round" opacity="0.55"/>
  </svg>
  <div>
    <div class="eyebrow" id="pool-name"></div>
    <h1 id="title"></h1>
  </div>
</div>
<div class="rule"></div>

<div class="qr-wrap">
  <h2 id="qr-title"></h2>
  <img id="qr" alt="QR code">
</div>

<div class="steps">
  <h2 id="steps-title"></h2>
  <ol id="steps"></ol>
  <div class="report-hint" id="report-hint"></div>
</div>

<div class="nfc-spot">NFC</div>

<script>
"use strict";
const CFG = "__MANUAL_CONFIG__";
const M = CFG.strings;

document.documentElement.lang = CFG.language;
document.title = CFG.pool_name + " · " + M.title;

function setText(id, value){ document.getElementById(id).textContent = value; }
setText("pool-name", CFG.pool_name);
setText("title", M.title);
setText("qr-title", M.qr_title);
setText("steps-title", M.steps_title);
setText("report-hint", M.report_hint);
setText("print", M.print);
document.getElementById("qr").src = CFG.qr;

const list = document.getElementById("steps");
(M.steps || []).forEach(step => {
  const item = document.createElement("li");
  item.textContent = step;
  list.appendChild(item);
});

setTimeout(() => window.print(), 400);
</script>
</body>
</html>
