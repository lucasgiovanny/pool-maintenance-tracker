<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manual</title>
<style>
  :root{
    --deep:#0B4F6C; --aqua:#0FA3B1; --ink:#10222B; --muted:#5D7480; --line:#D6E2E6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--ink);max-width:720px;margin:0 auto;padding:28px 24px;
  }
  @page{size:A4;margin:16mm}
  .header-row{display:flex;align-items:center;gap:16px}
  .header-row .logo{flex:none;width:54px;height:54px;border-radius:14px}
  .eyebrow{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--aqua);font-weight:700;margin-bottom:4px;
  }
  h1{font-size:1.5rem;font-weight:800;color:var(--deep);line-height:1.15}
  .rule{height:6px;margin:14px 0 24px;
    background:repeating-linear-gradient(-45deg,var(--aqua) 0 12px,transparent 12px 24px);
    opacity:.85;border-radius:3px;
  }
  .grid{display:flex;gap:24px;align-items:stretch;flex-wrap:wrap}
  .panel{
    flex:1;min-width:260px;border:2px solid var(--line);border-radius:14px;
    padding:20px;text-align:center;
  }
  .panel h2{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--deep);font-weight:800;margin-bottom:12px}
  .panel img{width:200px;max-width:80%;height:auto;image-rendering:pixelated}
  .url{font-size:.66rem;color:var(--muted);word-break:break-all;margin-top:10px;line-height:1.5}
  .caption{font-size:.8rem;color:var(--muted);margin-top:10px;line-height:1.45}
  .nfc-box{
    border:3px dashed var(--aqua);border-radius:14px;height:170px;margin-top:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-weight:700;font-size:.9rem;
  }
  .steps{margin-top:28px}
  .steps h2{font-size:1rem;font-weight:800;color:var(--deep);margin-bottom:14px}
  ol{padding-left:22px}
  ol li{font-size:.92rem;line-height:1.5;margin-bottom:9px}
  .report-hint{
    margin-top:18px;background:#E8F6F7;border:1px solid var(--aqua);border-radius:12px;
    padding:12px 16px;font-size:.85rem;line-height:1.5;color:var(--deep);
  }
  footer{margin-top:30px;font-size:.7rem;color:var(--muted);
    border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between}
  .print-button{
    position:fixed;right:18px;top:18px;background:var(--deep);color:#fff;border:none;
    border-radius:12px;padding:12px 22px;font-size:.95rem;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  @media print{.print-button{display:none}}
</style>
</head>
<body>

<button class="print-button" id="print" onclick="window.print()"></button>

<div class="header-row">
  <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="#0B4F6C"/>
    <path d="M76 114l36 36 70-72" stroke="#FFFFFF" stroke-width="24" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 184q16-14 32 0t32 0t32 0t32 0t32 0" stroke="#0FA3B1"
          stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M60 212q16-11 32 0t32 0t32 0t32 0" stroke="#0FA3B1" stroke-width="11"
          fill="none" stroke-linecap="round" opacity="0.55"/>
  </svg>
  <div>
    <div class="eyebrow" id="pool-name"></div>
    <h1 id="title"></h1>
  </div>
</div>
<div class="rule"></div>

<div class="grid">
  <div class="panel">
    <h2 id="qr-title"></h2>
    <img id="qr" alt="QR code">
    <p class="caption" id="qr-caption"></p>
  </div>
  <div class="panel">
    <h2 id="nfc-title"></h2>
    <div class="nfc-box" id="nfc-box"></div>
    <p class="caption" id="nfc-caption"></p>
  </div>
</div>

<div class="steps">
  <h2 id="steps-title"></h2>
  <ol id="steps"></ol>
  <div class="report-hint" id="report-hint"></div>
</div>

<footer>
  <span>Pool Maintenance Tracker</span>
  <span id="date"></span>
</footer>

<script>
"use strict";
const CFG = "__MANUAL_CONFIG__";
const M = CFG.strings;

document.documentElement.lang = CFG.language;
document.title = CFG.pool_name + " · " + M.title;

function setText(id, value){ document.getElementById(id).textContent = value; }
setText("pool-name", CFG.pool_name);
setText("title", M.title);
setText("qr-title", M.qr_title);
setText("qr-caption", M.qr_caption);
setText("nfc-title", M.nfc_title);
setText("nfc-box", M.nfc_box);
setText("nfc-caption", M.nfc_caption);
setText("steps-title", M.steps_title);
setText("report-hint", M.report_hint);
setText("print", M.print);
setText("date", new Date().toLocaleDateString(CFG.language === "pt" ? "pt-PT" : CFG.language));
document.getElementById("qr").src = CFG.qr;

const list = document.getElementById("steps");
(M.steps || []).forEach(step => {
  const item = document.createElement("li");
  item.textContent = step;
  list.appendChild(item);
});

setTimeout(() => window.print(), 400);
</script>
</body>
</html>
