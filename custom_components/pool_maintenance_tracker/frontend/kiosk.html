<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Pool</title>
<style>
  :root{
    --bg:#0A0B0C;
    --panel:#141719;
    --panel-2:#1B1F22;
    --line:#252B2F;
    --ink:#F2F6F7;
    --muted:#8A979C;
    --aqua:#6FD8EC;
    --green:#79E0A8;
    --amber:#E9B94F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    cursor:none;user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;padding:2.2vh 1.8vw 1.8vh;
  }
  .title{
    font-size:1.5vh;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:1.4vh;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:baseline;gap:1.2vw;flex:none;
    padding-bottom:1.6vh;border-bottom:1px solid var(--line);
  }
  header h1{font-size:3.6vh;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
  header .date{font-size:1.9vh;color:var(--muted);font-weight:600}
  header .conn{
    margin-left:auto;font-size:1.5vh;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.6vw;
  }
  header .conn .dot{width:1vh;height:1vh;border-radius:50%;background:var(--green)}
  header .conn.stale .dot{background:var(--amber)}
  header .clock{font-size:4.6vh;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-left:1.4vw}

  /* ---------- 3 columns ---------- */
  main{flex:1;display:grid;grid-template-columns:1.05fr 1.2fr .9fr;min-height:0}
  main > section{padding:1.8vh 1.6vw;min-height:0;display:flex;flex-direction:column}
  main > section + section{border-left:1px solid var(--line)}
  main > section:first-child{padding-left:0}
  main > section:last-child{padding-right:0}

  /* ---------- temperature ---------- */
  .temp{font-size:12vh;font-weight:800;color:var(--aqua);line-height:.92;
        font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .temp small{font-size:3.4vh;font-weight:700;margin-left:.6vw}
  .temp-sub{font-size:1.75vh;color:var(--muted);font-weight:600;margin-top:1.2vh}
  .temp-sub b{color:var(--green);font-weight:700}

  .minis{display:grid;grid-template-columns:1fr 1fr;gap:1vh 1vw;margin-top:2.2vh}
  .mini{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:1.1vh 1vw}
  .mini .k{font-size:1.35vh;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .mini .v{font-size:3.2vh;font-weight:800;line-height:1.1;margin-top:.5vh}
  .mini .v.on{color:var(--green)}
  .mini .v.off{color:var(--muted)}
  .mini .v.ideal{color:var(--green)}
  .mini .v.low,.mini .v.high{color:var(--amber)}
  .mini .s{font-size:1.5vh;color:var(--muted);font-weight:600;margin-top:.3vh}
  .mini .s .tag{
    display:inline-block;border-radius:999px;padding:.2vh .7vw;margin-right:.5vw;
    font-size:1.3vh;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  }
  .mini .s .tag.low,.mini .s .tag.high{background:rgba(233,185,79,.18);color:var(--amber)}
  .mini .s .tag.ideal{background:rgba(47,204,139,.16);color:var(--green)}

  .cycle{margin-top:auto}
  .cycle .head{display:flex;align-items:baseline;justify-content:space-between}
  .cycle .head .hours{font-size:1.9vh;font-weight:700;color:var(--ink)}
  .cycle .track{
    position:relative;height:1.4vh;background:var(--panel);border-radius:.7vh;margin-top:1vh;
  }
  .cycle .block{position:absolute;top:0;bottom:0;background:#2E7E8C;border-radius:.7vh}
  .cycle .now{position:absolute;top:-.35vh;bottom:-.35vh;width:.35vh;background:var(--ink);border-radius:2px}
  .cycle .axis{display:flex;justify-content:space-between;margin-top:.7vh;
    font-size:1.3vh;color:var(--muted);font-weight:600}
  .cycle-hint{font-size:1.4vh;color:var(--muted);font-weight:600;margin-top:.8vh}
  .cycle-hint b{color:var(--aqua)}

  /* ---------- attention + tasks ---------- */
  .attention{
    background:rgba(233,185,79,.10);border:1px solid rgba(233,185,79,.55);
    border-radius:1.4vh;padding:1.4vh 1.4vw;margin-bottom:2vh;flex:none;
  }
  .attention .h{
    display:flex;align-items:center;gap:.7vw;font-size:2.2vh;font-weight:800;
    color:var(--amber);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1.1vh;
  }
  .attention .h svg{width:2.2vh;height:2.2vh;stroke:var(--amber);fill:none;stroke-width:2.2;stroke-linecap:round}
  .attention .items{display:flex;gap:2vw;flex-wrap:wrap}
  .attention .item .n{font-size:1.9vh;font-weight:700}
  .attention .item .d{font-size:1.6vh;color:var(--amber);font-weight:600;margin-top:.2vh}

  .tasks{display:grid;grid-template-columns:1fr 1fr;gap:0 2vw;flex:none}
  .task{
    display:flex;align-items:center;gap:.7vw;padding:1.05vh 0;
    border-bottom:1px solid var(--line);font-size:1.85vh;
  }
  .task .dot{width:.9vh;height:.9vh;border-radius:50%;background:#3C4548;flex:none}
  .task.due .dot{background:var(--amber)}
  .task .n{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .d{font-weight:700;color:var(--muted);white-space:nowrap}
  .task.due .d{color:var(--amber)}

  .chart{margin-top:auto}
  .chart .head{display:flex;align-items:baseline;justify-content:space-between}
  .chart .legend{font-size:1.4vh;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:.5vw}
  .chart .legend i{width:.9vh;height:.9vh;border-radius:50%;background:var(--amber);display:inline-block}
  .chart svg{width:100%;height:11vh;display:block;margin-top:1vh}

  /* ---------- visits + QR ---------- */
  .visit{padding:1.1vh 0;border-bottom:1px solid var(--line)}
  .visit:last-of-type{border-bottom:none}
  .visit .top{display:flex;justify-content:space-between;gap:1vw;align-items:baseline}
  .visit .who{font-size:2vh;font-weight:800}
  .visit .when{font-size:1.5vh;color:var(--muted);font-weight:600;white-space:nowrap}
  .visit .what{font-size:1.6vh;color:var(--muted);font-weight:600;margin-top:.3vh;line-height:1.35}

  .register{
    margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;
    padding:1.4vh 1.2vw;display:flex;align-items:center;gap:1.2vw;
  }
  .register img{width:11vh;height:11vh;flex:none;border-radius:.8vh;background:#fff;padding:.5vh;image-rendering:pixelated}
  .register .t{font-size:2.1vh;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
  .register .s{font-size:1.5vh;color:var(--muted);font-weight:600;margin-top:.6vh;line-height:1.35}
</style>
</head>
<body>

<header>
  <h1 id="pool-name"></h1>
  <div class="date" id="date"></div>
  <div class="conn" id="conn"><span class="dot"></span><span id="conn-label"></span></div>
  <div class="clock" id="clock"></div>
</header>

<main>
  <!-- left ------------------------------------------------------------- -->
  <section>
    <div class="title" id="temp-title"></div>
    <div class="temp" id="temp">—</div>
    <div class="temp-sub" id="temp-sub"></div>
    <div class="minis" id="minis"></div>
    <div class="cycle" id="cycle" style="display:none">
      <div class="head">
        <span class="title" style="margin:0" id="cycle-title"></span>
        <span class="hours" id="cycle-hours"></span>
      </div>
      <div class="track" id="cycle-track"></div>
      <div class="axis"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>24h</span></div>
      <div class="cycle-hint" id="cycle-hint"></div>
    </div>
  </section>

  <!-- middle ----------------------------------------------------------- -->
  <section>
    <div class="attention" id="attention" style="display:none">
      <div class="h">
        <svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/>
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <span id="attention-title"></span>
      </div>
      <div class="items" id="attention-items"></div>
    </div>
    <div class="title" id="tasks-title"></div>
    <div class="tasks" id="tasks"></div>
    <div class="chart" id="chart" style="display:none">
      <div class="head">
        <span class="title" style="margin:0" id="chart-title"></span>
        <span class="legend"><i></i><span id="chart-legend"></span></span>
      </div>
      <svg id="chart-svg" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <!-- right ------------------------------------------------------------ -->
  <section>
    <div class="title" id="visits-title"></div>
    <div id="visits"></div>
    <div class="register">
      <img id="qr" alt="">
      <div>
        <div class="t" id="register-title"></div>
        <div class="s" id="register-hint"></div>
      </div>
    </div>
  </section>
</main>

<script>
"use strict";
const CFG = "__KIOSK_CONFIG__";
const S = CFG.strings;
const K = S.kiosk;
const LOCALE = CFG.language === "pt" ? "pt-PT" : CFG.language;

let live = CFG.live || {};
let report = CFG.report || {};
let temperature = CFG.temperature || {series: [], delta_24h: null};
let lastOk = Date.now();

document.documentElement.lang = CFG.language;
document.title = CFG.pool_name;

function setText(id, value){ document.getElementById(id).textContent = value; }
function el(tag, cls, text){
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function svgEl(tag, attrs){
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}
function rangeStatus(key, value){
  const band = ((report.ranges) || {})[key];
  if (!band || value === undefined || value === null) return null;
  if (value < band.min) return "low";
  if (value > band.max) return "high";
  return "ideal";
}
function decimal(value){
  return Number.isInteger(value) ? value.toFixed(1) : String(value);
}
function shortDate(iso){
  return new Date(iso).toLocaleDateString(LOCALE, { day: "2-digit", month: "2-digit" });
}
function daysAgoShort(iso){
  if (!iso) return K.never_short;
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return S.report.today;
  return K.days_short.replace("{days}", days);
}
function relShort(iso){
  const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 3600) return K.minutes_short.replace("{n}", Math.max(1, Math.floor(seconds / 60)));
  if (seconds < 86400) return K.hours_short.replace("{n}", Math.floor(seconds / 3600));
  return daysAgoShort(iso);
}
function minutesOf(time){
  const [h, m] = time.split(":").map(Number);
  return h * 60 + (m || 0);
}

setText("pool-name", CFG.pool_name);
setText("temp-title", S.report.values.water_temperature);
setText("tasks-title", S.report.tasks);
setText("attention-title", K.attention);
setText("chart-title", K.temp_7d);
setText("chart-legend", K.maintenance);
setText("visits-title", K.visits);
setText("cycle-title", K.filtration_cycle);
setText("register-title", K.register);
setText("register-hint", K.register_hint);
document.getElementById("qr").src = CFG.qr || "";

/* ---------- clock + connection ---------- */
function tickClock(){
  const now = new Date();
  setText("clock", now.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" }));
  setText("date", now.toLocaleDateString(LOCALE, {
    weekday: "long", day: "2-digit", month: "short" }));
  const stale = Date.now() - lastOk > 180000;
  document.getElementById("conn").classList.toggle("stale", stale);
  setText("conn-label", stale ? K.offline : K.connected);
}

/* ---------- left column ---------- */
function renderTemperature(){
  const probe = live.temperature;
  const declared = report.values ? report.values.water_temperature : undefined;
  const value = probe ? probe.value : declared;
  const box = document.getElementById("temp");
  box.textContent = "";
  if (value === undefined || value === null) {
    box.textContent = "—";
  } else {
    box.appendChild(document.createTextNode(decimal(value)));
    box.appendChild(el("small", null, (probe && probe.unit) || S.units.water_temperature));
  }

  const parts = [];
  const delta = temperature.delta_24h;
  if (delta !== null && delta !== undefined) {
    parts.push(K.delta_24h.replace("{delta}", (delta > 0 ? "+" : "") + decimal(delta)));
  }
  const sub = document.getElementById("temp-sub");
  sub.textContent = parts.join(" · ");
  const heating = (report.roles || {}).heat_pump;
  if (heating && heating.state === "on") {
    if (parts.length) sub.appendChild(document.createTextNode(" · "));
    sub.appendChild(el("b", null, K.heating_active));
  }
}

function miniCard(key, value, valueClass, sub, tag){
  const card = el("div", "mini");
  card.appendChild(el("div", "k", key));
  card.appendChild(el("div", "v" + (valueClass ? " " + valueClass : ""), value));
  const line = el("div", "s");
  if (tag) line.appendChild(el("span", "tag " + tag.status, tag.text));
  if (sub) line.appendChild(document.createTextNode(sub));
  card.appendChild(line);
  return card;
}

function renderMinis(){
  const box = document.getElementById("minis");
  box.innerHTML = "";
  const values = report.values || {};
  const roles = report.roles || {};

  if (values.chlorinator_mode !== undefined || values.chlorinator_output !== undefined) {
    box.appendChild(miniCard(
      K.chlorinator,
      S.modes[values.chlorinator_mode] || values.chlorinator_mode || "—",
      null,
      values.chlorinator_output !== undefined
        ? values.chlorinator_output + " " + S.units.chlorinator_output : ""));
  }
  if (roles.pool_system) {
    const on = roles.pool_system.state === "on";
    const schedule = roles.filtration_schedule;
    let sub = relShort(roles.pool_system.last_changed);
    if (on && schedule && schedule.next_change) {
      sub = K.until.replace("{time}", new Date(schedule.next_change)
        .toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" }));
    }
    box.appendChild(miniCard(S.roles.pool_system,
      on ? S.report.state_on : S.report.state_off, on ? "on" : "off", sub));
  }
  if (roles.heat_pump) {
    const on = roles.heat_pump.state === "on";
    box.appendChild(miniCard(S.roles.heat_pump,
      on ? S.report.state_on : S.report.state_off, on ? "on" : "off",
      relShort(roles.heat_pump.last_changed)));
  }
  /* Water readings, coloured against their ideal band */
  [["ph", "ph", S.report.values.ph, ""],
   ["free_chlorine", "free_chlorine", S.report.values.free_chlorine, S.units.free_chlorine],
   ["salt_level", "salt", K.salt, S.units.salt_level]].forEach(([key, liveKey, label, unit]) => {
    const value = live[liveKey] ? live[liveKey].value : values[key];
    if (value === undefined || value === null) return;
    const status = rangeStatus(key, value);
    const band = (report.ranges || {})[key];
    const sub = status && band
      ? band.min + "–" + band.max + (unit ? " " + unit : "")
      : unit;
    box.appendChild(miniCard(label, decimal(value), status, sub,
      status ? { text: S.report.status[status], status: status } : null));
  });
  ["pump", "pool_light", "cover"].forEach(role => {
    if (!roles[role]) return;
    const on = roles[role].state === "on" || roles[role].state === "open";
    box.appendChild(miniCard(S.roles[role] || roles[role].name,
      on ? S.report.state_on : S.report.state_off, on ? "on" : "off",
      relShort(roles[role].last_changed)));
  });
}

function renderFiltrationHint(){
  const hint = document.getElementById("cycle-hint");
  const filtration = report.filtration;
  if (!hint) return;
  hint.textContent = "";
  if (!filtration) return;
  hint.appendChild(document.createTextNode(K.recommended + " "));
  const strong = document.createElement("b");
  strong.textContent = S.report.hours.replace("{h}", filtration.recommended_hours);
  hint.appendChild(strong);
  hint.appendChild(document.createTextNode(
    " · " + K.at_temperature.replace("{t}", filtration.temperature)));
}

function renderCycle(){
  renderFiltrationHint();
  const schedule = (report.roles || {}).filtration_schedule;
  const cycle = document.getElementById("cycle");
  const week = schedule && schedule.week;
  if (!week) {
    /* No schedule linked: keep the block for the recommendation alone */
    const hasHint = !!report.filtration;
    cycle.style.display = hasHint ? "" : "none";
    document.getElementById("cycle-track").innerHTML = "";
    setText("cycle-hours", "");
    return;
  }
  const todayIndex = (new Date().getDay() + 6) % 7;  // Monday = 0
  const blocks = week[todayIndex] || [];
  if (!blocks.length) { cycle.style.display = "none"; return; }
  cycle.style.display = "";
  setText("cycle-hours", blocks.map(([from, to]) => from + " – " + to).join("  ·  "));

  const track = document.getElementById("cycle-track");
  track.innerHTML = "";
  blocks.forEach(([from, to]) => {
    const start = minutesOf(from), end = Math.max(minutesOf(to), minutesOf(from) + 10);
    const block = el("div", "block");
    block.style.left = (start / 1440 * 100) + "%";
    block.style.width = ((end - start) / 1440 * 100) + "%";
    track.appendChild(block);
  });
  const now = new Date();
  const marker = el("div", "now");
  marker.style.left = ((now.getHours() * 60 + now.getMinutes()) / 1440 * 100) + "%";
  track.appendChild(marker);
}

/* ---------- middle column ---------- */
function taskLabel(task){
  return S.tiles[task.key] || S.report.values[task.key] || task.key;
}

function renderAttention(){
  const box = document.getElementById("attention");
  const items = document.getElementById("attention-items");
  items.innerHTML = "";
  const due = (report.tasks || []).filter(task => task.due);
  const acidLow = report.values && report.values.acid_tank_level === "quarter";
  if (!due.length && !acidLow) { box.style.display = "none"; return; }
  box.style.display = "";
  due.slice(0, 3).forEach(task => {
    const item = el("div", "item");
    item.appendChild(el("div", "n", taskLabel(task)));
    const overdueDays = task.next
      ? Math.floor((Date.now() - new Date(task.next).getTime()) / 86400000) : 0;
    item.appendChild(el("div", "d", task.last
      ? K.overdue_days.replace("{days}", Math.max(overdueDays, 0))
      : K.never_recorded));
    items.appendChild(item);
  });
  if (acidLow) {
    const item = el("div", "item");
    item.appendChild(el("div", "n", S.report.values.acid_tank_level));
    item.appendChild(el("div", "d", S.acid_levels.quarter));
    items.appendChild(item);
  }
}

function renderTasks(){
  const box = document.getElementById("tasks");
  box.innerHTML = "";
  (report.tasks || []).forEach(task => {
    const row = el("div", "task" + (task.due ? " due" : ""));
    row.appendChild(el("span", "dot"));
    row.appendChild(el("span", "n", taskLabel(task)));
    let detail;
    if (!task.last) detail = K.never_short;
    else if (task.due) detail = daysAgoShort(task.last);
    else if (task.next) detail = shortDate(task.next);
    else detail = daysAgoShort(task.last);
    row.appendChild(el("span", "d", detail));
    box.appendChild(row);
  });
}

function renderChart(){
  const chart = document.getElementById("chart");
  const series = temperature.series || [];
  if (series.length < 2) { chart.style.display = "none"; return; }
  chart.style.display = "";
  const svg = document.getElementById("chart-svg");
  svg.innerHTML = "";

  const W = 300, H = 70, PAD = 6;
  const times = series.map(point => new Date(point.t).getTime());
  const values = series.map(point => point.v);
  const tMin = Math.min(...times), tMax = Math.max(...times);
  let vMin = Math.min(...values), vMax = Math.max(...values);
  if (vMin === vMax) { vMin -= 1; vMax += 1; }
  const span = vMax - vMin; vMin -= span * .25; vMax += span * .25;
  const x = t => PAD + ((t - tMin) / (tMax - tMin || 1)) * (W - PAD * 2);
  const y = v => (H - PAD) - ((v - vMin) / (vMax - vMin)) * (H - PAD * 2);

  svg.appendChild(svgEl("polyline", {
    points: series.map(point => x(new Date(point.t).getTime()) + "," + y(point.v)).join(" "),
    fill: "none", stroke: "#6FD8EC", "stroke-width": 1.6,
    "stroke-linejoin": "round", "stroke-linecap": "round",
    "vector-effect": "non-scaling-stroke"
  }));

  /* maintenance markers on the days something was logged */
  const logged = new Set((report.records || []).map(
    record => new Date(record.logged_at).toDateString()));
  series.forEach(point => {
    if (!logged.has(new Date(point.t).toDateString())) return;
    svg.appendChild(svgEl("circle", {
      cx: x(new Date(point.t).getTime()), cy: y(point.v), r: 2.4, fill: "#E9B94F"
    }));
  });
}

/* ---------- right column ---------- */
function renderVisits(){
  const box = document.getElementById("visits");
  box.innerHTML = "";
  const records = (report.records || []).slice(0, 3);
  if (!records.length) {
    box.appendChild(el("div", "visit", K.no_visits));
    return;
  }
  records.forEach(record => {
    const item = el("div", "visit");
    const top = el("div", "top");
    top.appendChild(el("div", "who", record.person || "?"));
    top.appendChild(el("div", "when", new Date(record.logged_at).toLocaleDateString(
      LOCALE, { day: "2-digit", month: "2-digit" })));
    item.appendChild(top);
    const bits = (record.categories || []).map(
      category => S.tiles[category] || category);
    Object.entries(record.data || {}).forEach(([key, value]) => {
      if (key === "salt_added") bits.push(value + " " + S.units.salt_added);
    });
    if (bits.length) item.appendChild(el("div", "what", bits.join(" · ")));
    box.appendChild(item);
  });
}

/* ---------- refresh ---------- */
function renderAll(){
  renderTemperature();
  renderMinis();
  renderCycle();
  renderAttention();
  renderTasks();
  renderChart();
  renderVisits();
}

let refreshing = false;
async function refresh(){
  if (refreshing) return;
  refreshing = true;
  try {
    const response = await fetch(CFG.state_endpoint);
    if (response.ok) {
      const data = await response.json();
      live = data.live || {};
      report = data.report || {};
      if (data.temperature) temperature = data.temperature;
      lastOk = Date.now();
      renderAll();
    }
  } catch (error) { /* keep the last good data on screen */ }
  refreshing = false;
}

renderAll();
tickClock();
setInterval(tickClock, 1000);
setInterval(renderCycle, 60000);
setInterval(refresh, 30000);
</script>
