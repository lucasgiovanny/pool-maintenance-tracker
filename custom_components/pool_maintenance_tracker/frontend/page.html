<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale: iOS has ignored it since iOS 10, and on Android it is
     the thing that stops somebody pinching in to read a number. The zoom that
     was in the way is the double-tap one, and that is handled in CSS. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pool maintenance</title>
<style>
  :root{
    --deep:#0B4F6C;
    --aqua:#0FA3B1;
    --bg:#F4F8F9;
    --ink:#10222B;
    --muted:#5D7480;
    --line:#D6E2E6;
    --warn:#E8890C;
    --ok:#1E9E6A;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* Two quick taps on the stepper is somebody counting up, not somebody
     asking to zoom. This drops the double-tap gesture on everything you can
     tap — and only that gesture: pinch to zoom still works, which is why it
     goes here instead of into the viewport meta. */
  button,a,input,textarea{touch-action:manipulation}
  html{font-size:16px}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:110px;
  }

  header{
    background:var(--deep);
    color:var(--white);
    padding:20px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:8px;
    background:repeating-linear-gradient(-45deg,var(--aqua) 0 14px,transparent 14px 28px);
    opacity:.9;
  }
  .header-row{display:flex;align-items:center;gap:14px}
  .header-row .logo{flex:none;width:46px;height:46px;border-radius:12px}
  .eyebrow{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--aqua);font-weight:700;margin-bottom:4px;
  }
  h1{font-weight:800;font-size:1.45rem;line-height:1.15}
  header p{font-size:.85rem;opacity:.75;margin-top:6px}

  main{max-width:560px;margin:0 auto;padding:18px 16px 0}

  .tabs{
    display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;
    margin-top:18px;background:var(--white);
  }
  .tabs button{
    flex:1;border:none;background:var(--white);padding:13px 6px;font-size:.95rem;font-weight:700;
    color:var(--muted);cursor:pointer;font-family:inherit;border-right:1px solid var(--line);
  }
  .tabs button:last-child{border-right:none}
  .tabs button.on{background:var(--deep);color:var(--white)}
  .tabs.periods{border-width:1px;border-radius:10px;max-width:300px;margin-left:auto;margin-right:auto}
  .tabs.periods button{padding:8px 6px;font-size:.78rem;font-weight:600}
  .tabs.periods button.on{background:var(--aqua)}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;margin-top:16px;
  }
  .card h3{
    font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--deep);font-weight:700;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .card h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--aqua)}

  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      padding:9px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv .k{font-size:.88rem;font-weight:600;color:var(--muted)}
  .kv .v{font-size:1rem;font-weight:700;color:var(--ink);text-align:right}
  .kv .v small{font-weight:600;color:var(--muted);font-size:.78rem}
  .kv .probe{display:block;font-size:.75rem;font-weight:700;color:var(--aqua);text-align:right}

  .runbar{padding:12px 0 11px}
  .runbar .track{
    position:relative;height:8px;border-radius:999px;background:var(--bg);
    border:1px solid var(--line);overflow:hidden;
  }
  .runbar .fill{height:100%;background:var(--aqua);border-radius:999px;transition:width .4s ease}
  .runbar.done .fill{background:#2FCC8B}
  .runbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--white);opacity:.9}
  .runbar .legend{margin-top:5px;font-size:.72rem;font-weight:700;color:var(--muted)}
  .runbar.done .legend{color:#14684A}

  .badge{
    display:inline-block;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700;
  }
  .badge.due{background:#FBE9D0;color:#8A5200}
  .badge.ok{background:#DCF3E9;color:#14684A}
  .badge.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .badge.info{background:#E8F6F7;color:var(--deep);border:1px solid var(--aqua)}

  .rec{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:none}
  .avatar{
    flex:none;width:38px;height:38px;border-radius:50%;background:var(--deep);color:var(--white);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;
    letter-spacing:.02em;
  }
  .rec .body{flex:1;min-width:0}
  .rec .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .rec .head .who{font-size:.9rem;font-weight:700}
  .rec .head .when{color:var(--muted);font-weight:600;font-size:.74rem;white-space:nowrap}
  .chips-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .cat-chip{
    display:inline-flex;align-items:center;gap:5px;background:#E8F6F7;
    border:1px solid var(--aqua);color:var(--deep);border-radius:999px;
    padding:3px 10px;font-size:.72rem;font-weight:700;
  }
  .cat-chip svg{width:13px;height:13px;stroke:var(--deep);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
  .val-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .val-pill{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:3px 9px;font-size:.72rem;color:var(--muted);font-weight:600;
  }
  .val-pill b{color:var(--ink);font-weight:700}
  .rec .note-text{font-size:.88rem;margin-top:5px;line-height:1.5;white-space:pre-wrap}

  .sec{margin-top:26px}
  .sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sec-title h2{font-size:1.02rem;font-weight:700}
  .sec-title small{color:var(--muted);font-size:.78rem;font-weight:500}

  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{
    border:2px solid var(--line);background:var(--white);
    border-radius:999px;padding:12px 20px;font-size:.95rem;font-weight:600;
    color:var(--muted);cursor:pointer;transition:all .15s;
    font-family:inherit;
  }
  .chip.on{border-color:var(--deep);background:var(--deep);color:var(--white)}

  .date-field{
    display:flex;align-items:center;gap:10px;
    border:2px solid var(--line);border-radius:12px;background:var(--white);
    padding:4px 14px;max-width:320px;
  }
  .date-field svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
  .date-field input{
    flex:1;border:none;background:none;font-family:inherit;font-size:1rem;
    font-weight:600;color:var(--ink);padding:10px 0;min-width:0;
  }
  .date-field input:focus{outline:none}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:460px){.tiles{grid-template-columns:repeat(3,1fr)}}
  .tile{
    background:var(--white);border:2px solid var(--line);border-radius:var(--radius);
    padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;transition:all .15s;font-family:inherit;min-height:104px;justify-content:center;
    text-align:center;
  }
  .tile svg{width:30px;height:30px;stroke:var(--muted);transition:stroke .15s;fill:none;stroke-width:2;stroke-linecap:round}
  .tile span{font-size:.82rem;font-weight:600;color:var(--ink);line-height:1.2}
  .tile.on{border-color:var(--aqua);background:#E8F6F7;box-shadow:inset 0 0 0 1px var(--aqua)}
  .tile.on svg{stroke:var(--deep)}
  .tile:active{transform:scale(.97)}

  .panel{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;margin-top:14px;display:none;
  }
  .panel.open{display:block}
  .panel h3{
    font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--deep);font-weight:700;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .panel h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--aqua)}

  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:8px}
  .field label .probe{color:var(--aqua);font-weight:700;white-space:nowrap}

  .stepper{display:flex;align-items:stretch;gap:0;border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .stepper button{
    width:64px;border:none;background:var(--bg);font-size:1.6rem;font-weight:700;
    color:var(--deep);cursor:pointer;font-family:inherit;
  }
  .stepper button:active{background:var(--line)}
  .stepper input{
    flex:1;border:none;text-align:center;font-size:1.5rem;font-weight:700;
    font-family:inherit;color:var(--ink);min-width:0;padding:14px 4px;background:var(--white);
  }
  .stepper input:focus{outline:none}
  .stepper .unit{
    display:flex;align-items:center;padding:0 14px;background:var(--white);
    color:var(--muted);font-size:.85rem;font-weight:600;border-left:1px solid var(--line);
  }

  .segments{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .segments button{
    flex:1;border:none;background:var(--white);padding:13px 6px;font-size:.9rem;font-weight:600;
    color:var(--muted);cursor:pointer;font-family:inherit;border-right:1px solid var(--line);
  }
  .segments button:last-child{border-right:none}
  .segments button.on{background:var(--deep);color:var(--white)}

  .hint{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.4}
  .band{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:6px}
  .band b{color:var(--ink)}
  .band.impact{color:var(--deep)}
  .badge.high,.badge.low{background:#FBE9D0;color:#8A5200}
  .badge.ideal{background:#DCF3E9;color:#14684A}

  textarea{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;
    font-family:inherit;resize:vertical;min-height:84px;background:var(--white);
    color:var(--ink);
    /* Not .95rem: iOS zooms the page in on any field under 16px the moment
       it takes focus, and then leaves it zoomed. */
    font-size:1rem;
  }
  textarea:focus{outline:none;border-color:var(--aqua)}

  .note-save{
    margin-top:10px;background:var(--deep);color:var(--white);border:none;border-radius:12px;
    padding:12px 22px;font-size:.92rem;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .note-save:disabled{background:var(--muted)}

  .week{margin:6px 0 10px}
  .week .day{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .week .day span{flex:none;width:24px;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase}
  .week .track{flex:1;position:relative;height:20px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .week .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .week .block{
    position:absolute;top:0;bottom:0;background:var(--aqua);border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:var(--white);font-size:.6rem;font-weight:700;letter-spacing:.01em;
    overflow:hidden;white-space:nowrap;
  }
  .week .axis{display:flex;gap:8px;margin-top:2px;margin-bottom:8px}
  .week .axis span:first-child{flex:none;width:24px}
  .week .axis .marks{flex:1;display:flex;justify-content:space-between;
    font-size:.62rem;color:var(--muted);font-weight:600}

  .rid{font-size:.62rem;color:var(--muted);font-family:ui-monospace,Menlo,monospace;
    margin-top:5px;word-break:break-all}

  .alerts{margin-top:16px}
  .alert{
    display:flex;align-items:flex-start;gap:9px;background:#FBE9D0;border:1px solid var(--warn);
    border-radius:12px;padding:11px 14px;margin-bottom:8px;
    font-size:.85rem;font-weight:600;color:#8A5200;line-height:1.4;
  }
  .alert svg{width:17px;height:17px;stroke:#8A5200;fill:none;stroke-width:2.2;stroke-linecap:round;flex:none;margin-top:1px}

  /* Maintenance mode: a flag for the home system, flipped from here. It
     turns amber when on, because leaving it on by accident is the one
     mistake worth shouting about. */
  .mode{
    display:flex;align-items:center;gap:14px;margin-top:16px;padding:13px 16px;
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  }
  .mode.on{background:#FBE9D0;border-color:var(--warn)}
  .mode .mode-text{flex:1;min-width:0}
  .mode .mode-text strong{display:block;font-size:.95rem;font-weight:700}
  .mode .mode-text small{
    display:block;color:var(--muted);font-size:.75rem;font-weight:600;
    margin-top:3px;line-height:1.4;
  }
  .mode.on .mode-text small{color:#8A5200}
  .mode .toggle{
    flex:none;width:58px;height:32px;border-radius:999px;border:none;position:relative;
    background:var(--line);cursor:pointer;font-family:inherit;transition:background .15s;
  }
  .mode .toggle i{
    position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
    background:var(--white);transition:transform .15s;box-shadow:0 1px 3px rgba(16,34,43,.3);
  }
  .mode .toggle[aria-checked="true"]{background:var(--warn)}
  .mode .toggle[aria-checked="true"] i{transform:translateX(26px)}
  .mode .toggle:disabled{opacity:.55;cursor:default}
  .mode .mode-text{cursor:default}
  .mode.on .mode-text{cursor:pointer}
  .countdown.inline{display:inline;padding:0;text-align:left;font-weight:700}
  .mode.on .countdown.inline{color:#8A5200}

  /* The sheet: what should happen while the technician works, and for how
     long. Rises from the bottom on a phone, sits in the middle on a screen. */
  .sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(16,34,43,.55)}
  .sheet.open{display:flex;align-items:flex-end;justify-content:center}
  .sheet-box{
    background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
  }
  @media(min-width:560px){
    .sheet.open{align-items:center}
    .sheet-box{border-radius:20px;max-height:86vh}
  }
  .sheet-box h3{font-size:1.15rem;font-weight:800;line-height:1.25}
  .sheet-box > .hint{margin:6px 0 20px}
  .sheet-box .segments button{padding:12px 4px;font-size:.85rem}
  .sheet-box .field{margin-bottom:14px}
  .sheet-box .field label{margin-bottom:6px}
  .sheet-box .field label .now{color:var(--aqua);font-weight:700;white-space:nowrap}
  /* Two questions, not one list: what should happen, and for how long */
  #sheet-duration{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .sheet-box .send{margin-top:22px}
  .sheet-box .stepper input{font-size:1.2rem;padding:11px 4px}
  .sheet-box .stepper button{width:54px;font-size:1.4rem}
  .sheet-cancel{
    display:block;width:100%;margin-top:8px;background:none;border:none;color:var(--muted);
    font-family:inherit;font-size:.95rem;font-weight:700;padding:12px;cursor:pointer;
  }

  .kv.with-countdown{border-bottom:none;padding-bottom:0}
  .countdown{
    font-size:.8rem;font-weight:700;color:var(--aqua);text-align:right;
    font-variant-numeric:tabular-nums;padding:1px 0 9px;
  }
  .countdown.last{border-bottom:1px solid var(--line)}
  .countdown.soon{color:var(--warn)}
  .countdown.imminent{color:var(--warn);animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.countdown.imminent{animation:none}}

  .bar{
    position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 70%,transparent);
  }
  .send{
    width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--deep);color:var(--white);border:none;border-radius:16px;
    padding:18px;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;
    box-shadow:0 6px 18px rgba(11,79,108,.28);transition:transform .12s;
  }
  .send:active{transform:scale(.98)}
  .send:disabled{background:var(--muted);box-shadow:none}
  .send svg{width:20px;height:20px;stroke:var(--white);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .result{
    position:fixed;inset:0;background:var(--bg);z-index:50;display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;
  }
  .result.open{display:flex}
  .result .icon{
    width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin-bottom:22px;
  }
  .result.ok .icon{background:#DCF3E9}
  .result.err .icon{background:#FBE9D0}
  .result .icon svg{width:42px;height:42px}
  .result h2{font-size:1.3rem;margin-bottom:10px;font-weight:800}
  .result p{color:var(--muted);font-size:.95rem;line-height:1.5;max-width:340px}
  .result .summary{
    margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;text-align:left;font-size:.88rem;line-height:1.7;max-width:340px;width:100%;
  }
  .result .back{
    margin-top:26px;background:none;border:2px solid var(--deep);color:var(--deep);
    border-radius:999px;padding:12px 28px;font-weight:700;font-size:.95rem;font-family:inherit;cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
  button:focus-visible, input:focus-visible{
    outline:3px solid var(--warn);outline-offset:2px;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
      <rect x="0" y="0" width="256" height="256" rx="58" fill="#FFFFFF"/>
      <path d="M76 114l36 36 70-72" stroke="#0B4F6C" stroke-width="24" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 184q16-14 32 0t32 0t32 0t32 0t32 0" stroke="#0FA3B1"
            stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M60 212q16-11 32 0t32 0t32 0t32 0" stroke="#0FA3B1" stroke-width="11"
            fill="none" stroke-linecap="round" opacity="0.55"/>
    </svg>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
    </div>
  </div>
  <p id="intro"></p>
</header>

<main>
  <div class="alerts" id="alerts"></div>

  <div class="mode" id="mode" style="display:none">
    <div class="mode-text">
      <strong id="mode-title"></strong>
      <small id="mode-sub"></small>
    </div>
    <button type="button" class="toggle" id="mode-toggle" role="switch" aria-checked="false">
      <i></i>
    </button>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" class="on" id="tab-log"></button>
    <button type="button" id="tab-report"></button>
    <button type="button" id="tab-history"></button>
  </div>

  <div id="view-history" style="display:none">
    <div class="tabs periods" id="history-periods" style="margin-top:16px"></div>
    <div id="history-body"></div>
  </div>

  <div id="view-report" style="display:none">
    <div class="card" id="report-current" style="display:none">
      <h3 id="report-current-title"></h3>
      <div id="report-current-body"></div>
    </div>
    <div class="card" id="report-tasks" style="display:none">
      <h3 id="report-tasks-title"></h3>
      <div id="report-tasks-body"></div>
    </div>
    <div class="card" id="report-extra" style="display:none">
      <h3 id="report-extra-title"></h3>
      <div id="report-extra-body"></div>
    </div>
    <div class="card">
      <h3 id="report-notes-title"></h3>
      <div id="report-notes-body"></div>
    </div>
    <div class="card">
      <h3 id="report-history-title"></h3>
      <div id="report-history-body"></div>
    </div>
  </div>

  <div id="view-log">
  <section class="sec">
    <div class="sec-title"><h2 id="who-title"></h2></div>
    <div class="chips" id="who"></div>
  </section>

  <section class="sec">
    <div class="sec-title"><h2 id="when-title"></h2></div>
    <div class="date-field">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <input type="datetime-local" id="when">
    </div>
  </section>

</div>

<script>
"use strict";
/* Injected by the integration when the page is served. */
const CFG = "__POOL_CONFIG__";
const S = CFG.strings;

const ICONS = {
  water_test: '<path d="M12 3v13"/><circle cx="12" cy="19" r="3"/><path d="M9 7h6M9 11h6"/>',
  chlorinator: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h8"/>',
  salt: '<path d="M7 21h10l1.5-11h-13z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>',
  filter_wash: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M6 6.5c2 1.4 10 1.4 12 0M6 17.5c2-1.4 10-1.4 12 0"/>',
  cell_clean: '<rect x="6" y="4" width="12" height="16" rx="2"/><path d="M10 8v8M14 8v8"/>',
  probe_calibration: '<path d="M12 3v8"/><circle cx="12" cy="16" r="5"/><path d="M12 14v2l1.5 1"/>',
  acid_refill: '<path d="M12 3s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/><path d="M9 15a3 3 0 0 0 3 3"/>',
  cleaning: '<path d="M4 20l4-9 5 5-9 4z"/><path d="M13 11l7-7M14 4h6v6"/>',
  other: '<circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'
};

const PLACEHOLDERS = {
  ph: "7.2", free_chlorine: "1.5", total_chlorine: "1.5", total_alkalinity: "100",
  cyanuric_acid: "50", calcium_hardness: "250", salt_level: "3.0",
  salt_added: "25", chlorinator_output: "10", water_temperature: "27.0"
};

document.documentElement.lang = CFG.language;
document.title = CFG.pool_name + " · " + S.title;
setText("eyebrow", CFG.pool_name);
setText("title", S.title);
setText("intro", S.intro);
setText("who-title", S.who);
setText("when-title", S.when);
setText("what-title", S.what);
setText("what-hint", S.what_hint);
setText("send-label", S.save);
setText("res-back", S.again);
setText("tab-log", S.tabs.log);
setText("tab-report", S.tabs.report);
setText("tab-history", S.tabs.history);
setText("report-current-title", S.report.current);
setText("report-tasks-title", S.report.tasks);
setText("report-extra-title", S.report.equipment);
setText("report-notes-title", S.report.notes);
setText("report-history-title", S.report.history);
setText("notes-title", S.notes.title);
setText("notes-hint", S.notes.hint);
setText("print-manual", S.print_manual);
document.getElementById("print-manual").href = CFG.manual_endpoint;
document.getElementById("note").placeholder = S.notes.placeholder;

/* ---------- tabs (hidden entirely when the report is disabled) ---------- */
if (!CFG.report) {
  document.getElementById("tabs").style.display = "none";
  document.getElementById("view-report").remove();
  document.getElementById("view-history").remove();
}
const tabLog = document.getElementById("tab-log");
const tabReport = document.getElementById("tab-report");
const tabHistory = document.getElementById("tab-history");
function showTab(which){
  tabLog.classList.toggle("on", which === "log");
  tabReport.classList.toggle("on", which === "report");
  tabHistory.classList.toggle("on", which === "history");
  document.getElementById("view-log").style.display = which === "log" ? "" : "none";
  document.getElementById("view-report").style.display = which === "report" ? "" : "none";
  document.getElementById("view-history").style.display = which === "history" ? "" : "none";
  document.querySelector(".bar").style.display = which === "log" ? "" : "none";
  if (which === "history") loadHistory(historyDays);
}
tabLog.addEventListener("click", () => showTab("log"));
tabReport.addEventListener("click", () => showTab("report"));
tabHistory.addEventListener("click", () => showTab("history"));

/* Deep links from the Home Assistant card: #status / #history */
const HASH_TABS = {"#status": "report", "#report": "report", "#history": "history"};
if (HASH_TABS[location.hash]) showTab(HASH_TABS[location.hash]);

/* ---------- report rendering ---------- */
const LOCALE = CFG.language === "pt" ? "pt-PT" : CFG.language;
function formatStamp(iso){
  const date = new Date(iso);
  return isNaN(date.getTime())
    ? "?"
    : date.toLocaleString(LOCALE, { dateStyle: "short", timeStyle: "short" });
}
function daysAgoText(iso){
  if (!iso) return S.report.never;
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return S.report.today;
  if (days === 1) return S.report.day_ago;
  return S.report.days_ago.replace("{days}", days);
}
function relTime(iso){
  const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 90) return S.report.just_now;
  if (seconds < 3600) return S.report.ago_minutes.replace("{n}", Math.floor(seconds / 60));
  if (seconds < 86400) return S.report.ago_hours.replace("{n}", Math.floor(seconds / 3600));
  return daysAgoText(iso);
}
/* Trim the trailing zero: 1.6 stays 1.6, 2.0 becomes 2 */
function decimal(value){
  const number = Number(value);
  return isNaN(number) ? String(value) : String(Math.round(number * 100) / 100);
}
/* Levels worth an alert. A pool running without a drum is a decision,
   not a fault, so it stays quiet. */
const ACID_ALERT_LEVELS = ["quarter", "empty", "none"];
function acidClass(level){
  if (ACID_ALERT_LEVELS.includes(level)) return "due";
  if (level === "full") return "ok";
  if (level === "none") return "neutral";
  return "info";
}
function formatValue(key, value){
  if (key === "chlorinator_mode") return S.modes[value] || value;
  if (key === "acid_tank_level") return S.acid_levels[value] || value;
  if (key === "cleaning_types" && Array.isArray(value)) {
    return value.map(type => S.cleaning_types[type] || type).join(", ");
  }
  const unit = S.units[key];
  return unit ? value + " " + unit : String(value);
}

function renderReport(){
  if (!CFG.report) return;
  const report = CFG.report;

  /* Idempotent: the status tab is re-rendered by the auto-refresh */
  ["report-current", "report-tasks", "report-extra"].forEach(id => {
    document.getElementById(id).style.display = "none";
  });
  ["report-current-body", "report-tasks-body", "report-extra-body",
   "report-history-body"].forEach(id => {
    document.getElementById(id).innerHTML = "";
  });

  /* Current status: water readings (declared, falling back to the probe).
     combined_chlorine is derived by the server (total − free, same test
     session only), so it reads from its own report field. */
  const WATER_KEYS = ["ph", "free_chlorine", "total_chlorine", "combined_chlorine",
    "total_alkalinity", "cyanuric_acid", "calcium_hardness",
    "salt_level", "water_temperature", "cleaning_types"];
  const currentBody = document.getElementById("report-current-body");
  let currentAny = false;
  WATER_KEYS.forEach(key => {
    /* The server already decided which of the probe and the manual entry
       is the current one — whichever was measured last. */
    const reading = (report.current || {})[key];
    const declared = key === "combined_chlorine"
      ? (report.combined_chlorine === null ? undefined : report.combined_chlorine)
      : (report.values ? report.values[key] : undefined);
    if (!reading && declared === undefined) return;
    currentAny = true;
    const row = el("div", "kv");
    row.appendChild(el("span", "k", S.report.values[key] || key));
    let holder;
    let shown;
    if (reading) {
      shown = reading.value;
      holder = el("span", "v", reading.unit
        ? reading.value + " " + reading.unit : formatValue(key, reading.value));
      if (reading.source === "probe") {
        holder.appendChild(el("span", "probe", S.probe));
      } else if (reading.other !== null && reading.other !== undefined) {
        holder.appendChild(el("span", "probe", S.probe + ": " + reading.other));
      }
    } else {
      shown = declared;
      holder = el("span", "v", formatValue(key, declared));
    }
    const status = rangeStatus(key, shown);
    if (status) {
      const badge = el("span", "badge " + status, S.report.status[status]);
      badge.style.marginRight = "8px";
      holder.insertBefore(badge, holder.firstChild);
    }
    row.appendChild(holder);
    currentBody.appendChild(row);
  });

  /* How much of today's schedule the pump has actually delivered. Reading
     a bar is quicker than comparing two numbers, and going past the plan
     should look finished rather than merely larger. */
  function runBar(f){
    const actual = f.actual_hours;
    const target = f.scheduled_hours;
    if (actual === null || actual === undefined
        || target === null || target === undefined) return null;
    const scale = Math.max(target, actual) || 1;
    const done = actual >= target;
    const wrap = el("div", "runbar" + (done ? " done" : ""));
    const track = el("div", "track");
    const fill = el("div", "fill");
    fill.style.width = Math.min(100, actual / scale * 100) + "%";
    track.appendChild(fill);
    if (actual > target) {
      /* Where the target was, now that the fill has run past it */
      const tick = el("div", "tick");
      tick.style.left = (target / scale * 100) + "%";
      track.appendChild(tick);
    }
    wrap.appendChild(track);
    wrap.appendChild(el("div", "legend",
      S.report.actual_today.replace("{h}", actual)));
    return wrap;
  }

  /* Today's filtration: what the schedule asks for, what the pump did */
  const filtration = report.filtration;
  if (filtration) {
    const scheduled = filtration.scheduled_hours;
    const hasSchedule = scheduled !== null && scheduled !== undefined;
    const row = el("div", "kv");
    row.appendChild(el("span", "k", S.report.filtration));
    const holder = el("span", "v", hasSchedule
      ? S.report.hours.replace("{h}", scheduled)
      : S.report.actual_today.replace("{h}", filtration.actual_hours));
    row.appendChild(holder);
    currentBody.appendChild(row);
    const bar = runBar(filtration);
    if (bar) {
      row.classList.add("with-countdown");
      currentBody.appendChild(bar);
    }
    currentAny = true;
  }
  if (currentAny) document.getElementById("report-current").style.display = "";

  const tasksBody = document.getElementById("report-tasks-body");
  if ((report.tasks || []).length) {
    document.getElementById("report-tasks").style.display = "";
    report.tasks.forEach(task => {
      const row = el("div", "kv");
      const label = el("span", "k",
        S.tiles[task.key] || S.report.values[task.key] || task.key);
      row.appendChild(label);
      const value = el("span", "v");
      /* Merge the related declared value into the task row */
      if (task.key === "salt_added" && report.values
          && report.values.salt_added !== undefined && task.last) {
        value.appendChild(document.createTextNode(
          formatValue("salt_added", report.values.salt_added) + " · "));
      }
      if (task.key === "acid_refill" && report.values
          && report.values.acid_tank_level !== undefined) {
        const level = report.values.acid_tank_level;
        const cls = acidClass(level);
        value.appendChild(el("span", "badge " + cls, S.acid_levels[level] || level));
        value.appendChild(document.createTextNode(" "));
      }
      value.appendChild(document.createTextNode(daysAgoText(task.last) + " "));
      if (task.interval_days) {
        const byPressure = task.key === "filter_wash"
          && (report.filter_pressure || {}).due !== null
          && (report.filter_pressure || {}).due !== undefined;
        const badge = el("span", "badge " + (task.due ? "due" : "ok"),
          task.due
            ? (byPressure ? S.report.wash_filter : S.report.overdue)
            : (task.next && !byPressure
                ? S.report.next_due.replace("{date}", shortDate(task.next))
                : S.report.every_days.replace("{days}", task.interval_days)));
        value.appendChild(badge);
      }
      row.appendChild(value);
      tasksBody.appendChild(row);
    });
  }

  /* Equipment: our declared equipment states first, then external entities.
     The acid tank level lives on its task row, merged with the refill date. */
  const EQUIP_KEYS = ["chlorinator_mode", "chlorinator_output"];
  const extraBody = document.getElementById("report-extra-body");
  let equipAny = false;
  EQUIP_KEYS.forEach(key => {
    const declared = report.values ? report.values[key] : undefined;
    if (declared === undefined) return;
    equipAny = true;
    const row = el("div", "kv");
    row.appendChild(el("span", "k", S.report.values[key] || key));
    const holder = el("span", "v");
    if (key === "chlorinator_mode") {
      holder.appendChild(el("span", "badge info", S.modes[declared] || declared));
    } else if (key === "acid_tank_level") {
      const cls = acidClass(declared);
      holder.appendChild(el("span", "badge " + cls, S.acid_levels[declared] || declared));
    } else {
      holder.appendChild(document.createTextNode(formatValue(key, declared)));
    }
    row.appendChild(holder);
    extraBody.appendChild(row);
  });
  /* The filter's pressure: what actually decides whether it needs washing */
  const pressure = report.filter_pressure;
  if (pressure && pressure.value !== null && pressure.value !== undefined) {
    equipAny = true;
    const row = el("div", "kv");
    row.appendChild(el("span", "k", S.report.filter_pressure));
    const holder = el("span", "v");
    if (pressure.due) {
      holder.appendChild(el("span", "badge due", S.report.wash_filter));
      holder.appendChild(document.createTextNode(" "));
    }
    holder.appendChild(document.createTextNode(
      decimal(pressure.value) + (pressure.unit ? " " + pressure.unit : "")));
    if (pressure.rise_percent !== null && pressure.rise_percent !== undefined) {
      holder.appendChild(el("small", null,
        " " + S.report.pressure_rise.replace("{p}", pressure.rise_percent)));
    }
    row.appendChild(holder);
    extraBody.appendChild(row);
  }

  /* Entities with a named role come first, in a stable order */
  const ROLE_ORDER = ["pool_system", "heat_pump", "pump", "filtration_schedule",
                      "pool_light", "cover"];
  const roleItems = ROLE_ORDER
    .filter(role => (report.roles || {})[role])
    .map(role => Object.assign({}, report.roles[role], {label: S.roles[role]}));

  if ((report.extra || []).length || roleItems.length || equipAny) {
    document.getElementById("report-extra").style.display = "";
    roleItems.concat(report.extra || []).forEach(item => {
      const row = el("div", "kv");
      row.appendChild(el("span", "k", item.label || item.name));
      const holder = el("span", "v");
      /* null means the entity is a reading, not a thing that runs */
      const onOff = item.on !== null && item.on !== undefined;
      if (onOff || item.domain === "schedule") {
        holder.appendChild(el("span",
          "badge " + (item.on ? "ok" : "neutral"),
          item.on ? S.report.state_on : S.report.state_off));
        holder.appendChild(document.createTextNode(" "));
        let detail;
        if (item.next_change) {
          const when = new Date(item.next_change);
          const template = item.on
            ? S.report.schedule_off : S.report.schedule_on;
          detail = template
            .replace("{date}", when.toLocaleDateString(LOCALE))
            .replace("{time}", when.toLocaleTimeString(LOCALE,
              { hour: "2-digit", minute: "2-digit" }));
        } else {
          detail = relTime(item.last_changed);
        }
        holder.appendChild(el("small", null, detail));
      } else if (!isNaN(parseFloat(item.state))) {
        holder.appendChild(document.createTextNode(
          item.state + (item.unit ? " " + item.unit : "")));
      } else {
        holder.appendChild(document.createTextNode(item.state + " "));
        holder.appendChild(el("small", null, relTime(item.last_changed)));
      }
      row.appendChild(holder);
      extraBody.appendChild(row);
      if (item.next_change) {
        row.classList.add("with-countdown");
        const countdown = el("div", "countdown" + (item.week ? "" : " last"));
        countdown.dataset.target = item.next_change;
        extraBody.appendChild(countdown);
      }
      if (item.week) extraBody.appendChild(weekGrid(item.week));
    });
  }

  renderNotes(report.notes || []);

  const historyBody = document.getElementById("report-history-body");
  const records = report.records || [];
  if (!records.length) {
    historyBody.appendChild(el("p", "hint", S.report.empty_history));
    return;
  }
  records.forEach(record => historyBody.appendChild(recordElement(record)));
}

/* Weekly on-blocks of a schedule helper: 7 rows (Mon..Sun), 0-24h tracks */
function weekdayLabel(index){
  // 2024-01-01 is a Monday; derive localized short weekday labels from it
  return new Date(Date.UTC(2024, 0, 1 + index)).toLocaleDateString(
    LOCALE, { weekday: "short", timeZone: "UTC" }).replace(".", "").slice(0, 3);
}

function weekGrid(week){
  const wrap = document.createDocumentFragment();
  const grid = el("div", "week");
  week.forEach((blocks, index) => {
    const row = el("div", "day");
    row.appendChild(el("span", null, weekdayLabel(index)));
    const track = el("div", "track");
    [25, 50, 75].forEach(percent => {
      const tick = el("div", "tick");
      tick.style.left = percent + "%";
      track.appendChild(tick);
    });
    blocks.forEach(([from, to]) => {
      const toMinutes = time => {
        const [hours, minutes] = time.split(":").map(Number);
        return hours * 60 + (minutes || 0);
      };
      const start = toMinutes(from), end = Math.max(toMinutes(to), start + 10);
      const block = el("div", "block");
      block.style.left = (start / 1440 * 100) + "%";
      block.style.width = ((end - start) / 1440 * 100) + "%";
      /* The exact hours live inside the bar when there is room for them */
      const duration = end - start;
      if (duration >= 300) block.textContent = from + "–" + to;
      else if (duration >= 150) block.textContent = from;
      track.appendChild(block);
    });
    row.appendChild(track);
    grid.appendChild(row);
  });
  const axis = el("div", "axis");
  axis.appendChild(el("span"));
  const marks = el("div", "marks");
  ["0h", "6h", "12h", "18h", "24h"].forEach(mark => marks.appendChild(el("span", null, mark)));
  axis.appendChild(marks);
  grid.appendChild(axis);
  wrap.appendChild(grid);
  return wrap;
}

function initials(name){
  const parts = String(name || "?").trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : "?";
  const last = parts.length > 1 ? parts[parts.length - 1][0] : "";
  return (first + last).toUpperCase();
}

function personRow(person, stampIso){
  const item = el("div", "rec");
  item.appendChild(el("div", "avatar", initials(person)));
  const body = el("div", "body");
  const head = el("div", "head");
  head.appendChild(el("span", "who", person || "?"));
  head.appendChild(el("span", "when", formatStamp(stampIso)));
  body.appendChild(head);
  item.appendChild(body);
  return { item, body };
}

function recordElement(record){
  const { item, body } = personRow(record.person, record.logged_at);
  if ((record.categories || []).length) {
    const chips = el("div", "chips-mini");
    record.categories.forEach(category => {
      const chip = el("span", "cat-chip");
      chip.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[category] || "") + "</svg>";
      chip.appendChild(document.createTextNode(S.tiles[category] || category));
      chips.appendChild(chip);
    });
    body.appendChild(chips);
  }
  const entries = Object.entries(record.data || {});
  if (entries.length) {
    const pills = el("div", "val-pills");
    entries.forEach(([key, value]) => {
      const pill = el("span", "val-pill");
      const strong = document.createElement("b");
      strong.textContent = formatValue(key, value);
      pill.appendChild(strong);
      pill.appendChild(document.createTextNode(" " + (S.report.values[key] || key)));
      pills.appendChild(pill);
    });
    body.appendChild(pills);
  }
  if (record.id) body.appendChild(el("div", "rid", "id " + record.id));
  return item;
}

/* Persistent alerts above the tabs: overdue tasks + low acid */
function renderAlerts(){
  const box = document.getElementById("alerts");
  box.innerHTML = "";
  box.style.display = "";
  if (!CFG.report) { box.style.display = "none"; return; }
  const report = CFG.report;
  const messages = [];
  (report.tasks || []).forEach(task => {
    if (task.due) {
      messages.push((S.tiles[task.key] || S.report.values[task.key] || task.key) +
        " — " + S.report.overdue.toLowerCase());
    }
  });
  const acid = report.values ? report.values.acid_tank_level : undefined;
  if (acid === "none") {
    messages.push(S.report.alert_acid_missing);
  } else if (ACID_ALERT_LEVELS.includes(acid)) {
    messages.push(S.report.alert_acid.replace("{level}",
      (S.acid_levels[acid] || "").toLowerCase()));
  }
  if (!messages.length) { box.style.display = "none"; return; }
  messages.forEach(message => {
    const alert = el("div", "alert");
    alert.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/>' +
      '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
    alert.appendChild(document.createTextNode(message));
    box.appendChild(alert);
  });
}
renderAlerts();

/* ---------- maintenance mode ---------- */
/* A visit: what the technician wants the equipment to do while they work,
   and for how long. The window does not switch anything off when it runs
   out — it ends the visit, and ending the visit is what puts the equipment
   back where it was. */
const M = S.maintenance;
const modeBox = document.getElementById("mode");
const modeToggle = document.getElementById("mode-toggle");
const modeText = modeBox.querySelector(".mode-text");
const sheet = document.getElementById("mode-sheet");
const PRESETS = [30, 60, 120, 240, 0];
const DEFAULT_MINUTES = 60;
let modeBusy = false;

function selectedPerson(){
  const chip = document.querySelector("#who .chip.on");
  return chip ? chip.dataset.v : "";
}

/* "Turn on" is what you ask for; "On" is what you are told it is now */
function askLabel(value){
  return value === "on" ? M.turn_on : value === "off" ? M.turn_off
    : value === "open" ? M.open : value === "closed" ? M.close : M.keep;
}
/* A cover says where it stands; everything else just runs or does not —
   including the thermostat that calls it "heat" rather than "on". */
function stateLabel(item){
  if (item.state === "open" || item.state === "opening") return M.is_open;
  if (item.state === "closed" || item.state === "closing") return M.is_closed;
  if (item.on === null || item.on === undefined) return item.state;
  return item.on ? S.report.state_on : S.report.state_off;
}
function clockTime(iso){
  return new Date(iso).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
}
function equipmentNames(){
  const names = {};
  (CFG.maintenance_equipment || []).forEach(item => { names[item.role] = item.name; });
  return names;
}

function renderMode(){
  const mode = CFG.maintenance_mode || {};
  if (!mode.enabled) { modeBox.style.display = "none"; return; }
  /* A refresh landing mid-request would repaint the state we just left */
  if (modeBusy) return;
  modeBox.style.display = "";
  modeBox.classList.toggle("on", !!mode.on);
  modeToggle.setAttribute("aria-checked", mode.on ? "true" : "false");
  setText("mode-title", M.title);
  const sub = document.getElementById("mode-sub");
  sub.textContent = "";
  if (!mode.on) { sub.textContent = M.hint; return; }

  const names = equipmentNames();
  const asked = Object.entries(mode.equipment || {})
    .map(([role, value]) => (names[role] || role) + " " + askLabel(value).toLowerCase());
  const bits = [S.report.state_on];
  if (mode.by) bits.push(M.by.replace("{who}", mode.by));
  if (mode.until) bits.push(M.ends.replace("{time}", clockTime(mode.until)));
  sub.appendChild(document.createTextNode(bits.join(" · ")));
  if (mode.until) {
    /* The same countdown element the status tab uses, so the one ticker
       already running keeps it honest to the second. */
    const countdown = el("span", "countdown inline");
    countdown.dataset.target = mode.until;
    sub.appendChild(document.createTextNode(" · "));
    sub.appendChild(countdown);
  }
  if (asked.length) {
    sub.appendChild(document.createElement("br"));
    sub.appendChild(document.createTextNode(asked.join(" · ")));
  }
}

/* ---------- the sheet ---------- */
function buildSheet(){
  const plan = (CFG.maintenance_mode || {}).equipment || {};
  setText("sheet-title", M.sheet_title);
  setText("sheet-hint", M.sheet_hint);
  setText("sheet-start-label", M.start);
  setText("sheet-cancel", M.cancel);

  const box = document.getElementById("sheet-equipment");
  box.innerHTML = "";
  (CFG.maintenance_equipment || []).forEach(item => {
    const field = el("div", "field");
    const label = el("label", null, item.name);
    label.appendChild(document.createTextNode(" · "));
    label.appendChild(el("span", "now", M.now.replace("{state}", stateLabel(item))));
    field.appendChild(label);
    const segments = el("div", "segments");
    segments.dataset.role = item.role;
    [""].concat(item.values).forEach(value => {
      const chosen = (plan[item.role] || "") === value;
      const button = el("button", chosen ? "on" : "", askLabel(value));
      button.type = "button";
      button.dataset.v = value;
      button.addEventListener("click", () => {
        segments.querySelectorAll("button").forEach(other => other.classList.remove("on"));
        button.classList.add("on");
      });
      segments.appendChild(button);
    });
    field.appendChild(segments);
    box.appendChild(field);
  });

  const duration = document.getElementById("sheet-duration");
  duration.innerHTML = "";
  duration.appendChild(el("label", null, M.duration));
  const presets = el("div", "segments");
  presets.id = "sheet-presets";
  PRESETS.forEach(minutes => {
    const button = el("button", minutes === DEFAULT_MINUTES ? "on" : "",
      minutes === 0 ? M.no_limit
        : minutes < 60 ? M.preset_minutes.replace("{n}", minutes)
        : M.preset_hours.replace("{n}", minutes / 60));
    button.type = "button";
    button.dataset.v = String(minutes);
    button.addEventListener("click", () => {
      presets.querySelectorAll("button").forEach(other => other.classList.remove("on"));
      button.classList.add("on");
      custom.value = "";
    });
    presets.appendChild(button);
  });
  duration.appendChild(presets);

  /* An exact figure, for when none of the presets is the job */
  const stepper = el("div", "stepper");
  stepper.style.marginTop = "10px";
  const minus = el("button", null, "−");
  const plus = el("button", null, "+");
  minus.type = plus.type = "button";
  const custom = document.createElement("input");
  custom.type = "number";
  custom.id = "sheet-custom";
  custom.inputMode = "numeric";
  custom.step = "5";
  custom.min = "5";
  custom.max = "1440";
  custom.placeholder = "—";
  const bump = direction => {
    const current = parseInt(custom.value, 10) || presetMinutes() || DEFAULT_MINUTES;
    custom.value = String(Math.min(1440, Math.max(5, current + direction * 5)));
    presets.querySelectorAll("button").forEach(other => other.classList.remove("on"));
  };
  minus.addEventListener("click", () => bump(-1));
  plus.addEventListener("click", () => bump(1));
  custom.addEventListener("input", () => {
    if (custom.value) presets.querySelectorAll("button").forEach(b => b.classList.remove("on"));
  });
  stepper.append(minus, custom, el("div", "unit", M.minutes), plus);
  duration.appendChild(stepper);
}

function presetMinutes(){
  const active = document.querySelector("#sheet-presets button.on");
  return active ? Number(active.dataset.v) : 0;
}
function sheetMinutes(){
  const custom = parseInt((document.getElementById("sheet-custom") || {}).value, 10);
  return !isNaN(custom) && custom > 0 ? custom : presetMinutes();
}
function sheetPlan(){
  const plan = {};
  document.querySelectorAll("#sheet-equipment .segments").forEach(box => {
    const active = box.querySelector("button.on");
    if (active && active.dataset.v) plan[box.dataset.role] = active.dataset.v;
  });
  return plan;
}
function openSheet(){ buildSheet(); sheet.classList.add("open"); }
function closeSheet(){ sheet.classList.remove("open"); }

/* What actually moved, said back to the person who asked for it */
function modeSummary(data){
  const names = equipmentNames();
  const lines = [];
  Object.entries(data.applied || {}).forEach(([role, value]) =>
    lines.push("✓ " + (names[role] || role) + " · " + askLabel(value)));
  Object.entries(data.failed || {}).forEach(([role]) =>
    lines.push("⚠ " + M.failed.replace("{name}", names[role] || role)));
  if (data.until) lines.push(M.ends.replace("{time}", clockTime(data.until)));
  const summary = document.createElement("div");
  const header = document.createElement("strong");
  header.textContent = M.title + " · " + S.report.state_on;
  summary.appendChild(header);
  lines.forEach(text => {
    summary.appendChild(document.createElement("br"));
    summary.appendChild(document.createTextNode(text));
  });
  return summary.innerHTML;
}

async function setMode(on, extra){
  if (modeBusy) return;
  modeBusy = true;
  modeToggle.disabled = true;
  const start = document.getElementById("sheet-start");
  start.disabled = true;
  try {
    const response = await fetch(CFG.mode_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ on: on, person: selectedPerson() }, extra || {}))
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    CFG.maintenance_mode = data;
    closeSheet();
    if (on) {
      setText("res-back", M.ok);
      showResult(true, M.started, M.started_text, modeSummary(data));
    }
  } catch (error) {
    showResult(false, S.error_title, M.error, "");
  }
  modeBusy = false;
  modeToggle.disabled = false;
  start.disabled = false;
  renderMode();
}

modeToggle.addEventListener("click", () => {
  if (modeToggle.getAttribute("aria-checked") === "true") setMode(false);
  else openSheet();
});

modeText.addEventListener("click", () => {

});
document.getElementById("sheet-start").addEventListener("click", () =>

document.getElementById("sheet-cancel").addEventListener("click", closeSheet);
sheet.addEventListener("click", event => { if (event.target === sheet) closeSheet(); });

let modePolling = false;
async function refreshMode(){
  const mode = CFG.maintenance_mode || {};
  if (!mode.enabled || modeBusy || modePolling) return;
  if (document.visibilityState !== "visible") return;
  modePolling = true;
  try {
    const response = await fetch(CFG.mode_endpoint);
    if (response.ok) {
      CFG.maintenance_mode = await response.json();
      renderMode();
    }
  } catch (error) { /* transient network issue — next poll retries */ }
  modePolling = false;
}

renderMode();
if ((CFG.maintenance_mode || {}).enabled) {
  /* The status tab is optional and the state endpoint goes with it, so the
     flag polls on its own: a window closing has to show up here too. */
  setInterval(refreshMode, 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshMode();
  });
}

/* ---------- reactivity: countdowns + periodic state refresh ---------- */
function tickCountdowns(){
  document.querySelectorAll(".countdown").forEach(node => {
    const target = new Date(node.dataset.target).getTime();
    const total = Math.floor((target - Date.now()) / 1000);
    if (total <= 0) {
      node.textContent = "…";
      if (!node.dataset.fired) {
        node.dataset.fired = "1";
        /* A maintenance window closing is the server's call, not ours: ask
           rather than assume the flag has already dropped. */
        refreshState();
        refreshMode();
      }
      return;
    }
    let seconds = total;
    const days = Math.floor(seconds / 86400); seconds %= 86400;
    const formatted = (days ? days + "d " : "")
      + String(Math.floor(seconds / 3600)).padStart(2, "0") + ":"
      + String(Math.floor((seconds % 3600) / 60)).padStart(2, "0") + ":"
      + String(seconds % 60).padStart(2, "0");
    node.textContent = S.report.in_time.replace("{t}", formatted);
    node.classList.toggle("soon", total <= 3600 && total > 300);
    node.classList.toggle("imminent", total <= 300);
  });
}

let refreshing = false;
async function refreshState(){
  if (!CFG.report || refreshing) return;
  if (document.visibilityState !== "visible") return;
  refreshing = true;
  try {
    const response = await fetch(CFG.state_endpoint);
    if (response.ok) {
      const data = await response.json();
      CFG.live = data.live || {};
      CFG.report = data.report;
      if (data.maintenance_mode) CFG.maintenance_mode = data.maintenance_mode;
      renderAlerts();
      renderMode();
      renderReport();
    }
  } catch (error) { /* transient network issue — next poll retries */ }
  refreshing = false;
}

/* The ticker runs whatever the tabs are doing: the maintenance box has a
   countdown of its own, and without the status tab nothing else would tick
   it. With no .countdown on the page it costs a query per second. */
setInterval(tickCountdowns, 1000);
tickCountdowns();
if (CFG.report) {
  setInterval(refreshState, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshState();
  });
}

function svgEl(tag, attrs){
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, value));
  return node;
}

function chartCard(title, unit){
  const card = el("div", "card");
  const heading = el("h3", null, title);
  if (unit) {
    const small = el("small", null, " " + unit);
    small.style.textTransform = "none";
    small.style.color = "var(--muted)";
    heading.appendChild(small);
  }
  card.appendChild(heading);
  return card;
}

const CHART_W = 320, CHART_H = 110;
const PAD = { l: 34, r: 6, t: 8, b: 18 };

function chartFrame(minY, maxY, firstLabel, lastLabel){
  const svg = svgEl("svg", {
    viewBox: "0 0 " + CHART_W + " " + CHART_H,
    style: "width:100%;height:auto;display:block"
  });
  const base = svgEl("line", {
    x1: PAD.l, y1: CHART_H - PAD.b, x2: CHART_W - PAD.r, y2: CHART_H - PAD.b,
    stroke: "#D6E2E6", "stroke-width": 1
  });
  svg.appendChild(base);
  const labels = [
    [minY, CHART_H - PAD.b], [maxY, PAD.t + 6]
  ];
  labels.forEach(([value, y]) => {
    const text = svgEl("text", {
      x: PAD.l - 5, y: y + 3, "text-anchor": "end",
      "font-size": "9", fill: "#5D7480", "font-family": "inherit"
    });
    text.textContent = value;
    svg.appendChild(text);
  });
  [[firstLabel, PAD.l, "start"], [lastLabel, CHART_W - PAD.r, "end"]].forEach(
    ([label, x, anchor]) => {
      const text = svgEl("text", {
        x: x, y: CHART_H - 5, "text-anchor": anchor,
        "font-size": "9", fill: "#5D7480", "font-family": "inherit"
      });
      text.textContent = label;
      svg.appendChild(text);
    });
  return svg;
}

function shortDate(iso){
  const date = new Date(iso);
  return date.toLocaleDateString(LOCALE, { day: "2-digit", month: "2-digit" });
}

function scaleFactory(times, values){
  const tMin = Math.min(...times), tMax = Math.max(...times);
  let vMin = Math.min(...values), vMax = Math.max(...values);
  if (vMin === vMax) { vMin -= 1; vMax += 1; }
  const span = vMax - vMin;
  vMin -= span * 0.1; vMax += span * 0.1;
  return {
    x: t => tMax === tMin
      ? (PAD.l + CHART_W - PAD.r) / 2
      : PAD.l + ((t - tMin) / (tMax - tMin)) * (CHART_W - PAD.l - PAD.r),
    y: v => (CHART_H - PAD.b) - ((v - vMin) / (vMax - vMin)) * (CHART_H - PAD.t - PAD.b),
    vMin: vMin, vMax: vMax
  };
}

function round1(value){ return Math.round(value * 10) / 10; }

function lineChart(series){
  const sensor = series.sensor || [];
  const manual = series.manual || [];
  const all = sensor.concat(manual);
  const times = all.map(point => new Date(point.t).getTime());
  const values = all.map(point => point.v);
  const scale = scaleFactory(times, values);
  const svg = chartFrame(
    round1(scale.vMin), round1(scale.vMax),
    shortDate(all[0].t), shortDate(all[all.length - 1].t)
  );
  if (sensor.length > 1) {
    const path = sensor
      .map(point => scale.x(new Date(point.t).getTime()) + "," + scale.y(point.v))
      .join(" ");
    svg.appendChild(svgEl("polyline", {
      points: path, fill: "none", stroke: "#0FA3B1",
      "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
  }
  function pointLabel(point, color, bold){
    const x = Math.min(Math.max(scale.x(new Date(point.t).getTime()), PAD.l + 8), CHART_W - PAD.r - 8);
    const text = svgEl("text", {
      x: x, y: scale.y(point.v) - 5, "text-anchor": "middle",
      "font-size": "7.5", fill: color, "font-family": "inherit",
      "font-weight": bold ? "700" : "500"
    });
    text.textContent = point.v;
    svg.appendChild(text);
  }
  sensor.forEach(point => svg.appendChild(svgEl("circle", {
    cx: scale.x(new Date(point.t).getTime()), cy: scale.y(point.v),
    r: 2, fill: "#0FA3B1"
  })));
  if (sensor.length <= 14) sensor.forEach(point => pointLabel(point, "#0FA3B1", false));
  manual.forEach(point => svg.appendChild(svgEl("circle", {
    cx: scale.x(new Date(point.t).getTime()), cy: scale.y(point.v),
    r: 3.4, fill: "#0B4F6C"
  })));
  manual.forEach(point => pointLabel(point, "#0B4F6C", true));
  return svg;
}

function barChart(points, unitLabel){
  const values = points.map(point => point.v);
  const maxV = Math.max(...values, 1);
  const svg = chartFrame(
    0, round1(maxV) + " " + unitLabel,
    shortDate(points[0].t), shortDate(points[points.length - 1].t)
  );
  const innerW = CHART_W - PAD.l - PAD.r;
  const step = innerW / points.length;
  const barW = Math.max(2, Math.min(16, step * 0.65));
  points.forEach((point, index) => {
    const height = (point.v / maxV) * (CHART_H - PAD.t - PAD.b);
    const x = PAD.l + index * step + (step - barW) / 2;
    svg.appendChild(svgEl("rect", {
      x: x,
      y: (CHART_H - PAD.b) - height,
      width: barW, height: Math.max(height, point.v > 0 ? 2 : 0),
      rx: 2, fill: "#0FA3B1"
    }));
    if (points.length <= 16 && point.v > 0) {
      const label = svgEl("text", {
        x: x + barW / 2, y: (CHART_H - PAD.b) - height - 3,
        "text-anchor": "middle", "font-size": "7.5", fill: "#5D7480",
        "font-family": "inherit", "font-weight": "600"
      });
      label.textContent = point.v;
      svg.appendChild(label);
    }
  });
  return svg;
}

function legendLine(){
  const hint = el("p", "hint");
  hint.innerHTML = '<span style="color:#0FA3B1;font-weight:700">―</span> ' +
    "<span></span> &nbsp; <span style=\"color:#0B4F6C;font-weight:700\">●</span> <span></span>";
  const spans = hint.querySelectorAll("span");
  spans[1].textContent = S.history.sensor;
  spans[3].textContent = S.history.manual;
  return hint;
}

async function loadHistory(days, force){
  if (historyLoadedDays === days && !force) return;
  const body = document.getElementById("history-body");
  body.innerHTML = "";
  body.appendChild(el("p", "hint", S.history.loading));
  try {
    const response = await fetch(CFG.history_endpoint + "?days=" + days);
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    historyLoadedDays = days;
    body.innerHTML = "";
    renderHistory(body, data);
  } catch (error) {
    body.innerHTML = "";
    body.appendChild(el("p", "hint", S.history.error));
    historyLoadedDays = null;
  }
}

function renderHistory(body, data){
  let anything = false;

  Object.entries(data.readings || {}).forEach(([key, series]) => {
    anything = true;
    const card = chartCard(S.report.values[key === "salt" ? "salt_level" :
      key === "temperature" ? "water_temperature" : key] || key, series.unit);
    card.appendChild(lineChart(series));
    if ((series.sensor || []).length && (series.manual || []).length) {
      card.appendChild(legendLine());
    }
    body.appendChild(card);
  });

  (data.extra || []).forEach(item => {
    anything = true;
    if (item.type === "ontime") {
      const card = chartCard(item.name, S.history.on_hours);
      card.appendChild(barChart(item.points, "h"));
      body.appendChild(card);
    } else {
      const card = chartCard(item.name, item.unit);
      card.appendChild(lineChart({ sensor: item.points }));
      body.appendChild(card);
    }
  });

  if (!anything) {
    body.appendChild(el("p", "hint", S.history.no_data));
  }
}

const whenInput = document.getElementById("when");
function localDateTimeString(date){
  const offset = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - offset).toISOString().slice(0, 16);
}
const now = new Date();
whenInput.value = localDateTimeString(now);
whenInput.max = localDateTimeString(now);
whenInput.min = localDateTimeString(new Date(now.getTime() - 6 * 86400000));

function loggedAt(){
  if (!whenInput.value) return new Date().toISOString();
  const picked = new Date(whenInput.value);
  return isNaN(picked.getTime()) ? new Date().toISOString() : picked.toISOString();
}

function setText(id, value){ document.getElementById(id).textContent = value; }
function el(tag, cls, text){
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ---------- field builders ---------- */
/* stepper key -> key inside CFG.live (linked sensors) */
const LIVE_KEYS = {
  ph: "ph", free_chlorine: "free_chlorine",
  salt_level: "salt", water_temperature: "temperature"
};

function stepperField(labelText, key){
  if (!CFG.limits[key]) return null;
  const limit = CFG.limits[key];
  const live = LIVE_KEYS[key] ? CFG.live[LIVE_KEYS[key]] : null;
  const field = el("div", "field");
  const label = el("label", null, labelText);
  if (live) {
    label.appendChild(document.createTextNode(" · "));
    label.appendChild(el("span", "probe",
      S.probe + ": " + live.value + (live.unit ? " " + live.unit : "")));
  }
  field.appendChild(label);
  const box = el("div", "stepper");
  box.dataset.key = key;

  const minus = el("button", null, "−");
  minus.type = "button";
  const input = document.createElement("input");
  input.type = "number";
  input.inputMode = limit.step < 1 ? "decimal" : "numeric";
  input.step = String(limit.step);
  input.placeholder = PLACEHOLDERS[key] || String(limit.min);
  const unit = el("div", "unit", S.units[key] || "");
  const plus = el("button", null, "+");
  plus.type = "button";

  const decimals = (String(limit.step).split(".")[1] || "").length;

  /* Ideal band under the field, so whoever measures knows the target */
  const band = bandText(key);
  const note = band ? el("div", "band") : null;
  if (note) note.innerHTML = "";
  if (note) {
    const strong = document.createElement("b");
    strong.textContent = band;
    note.appendChild(strong);
  }

  /* Salt: turn kilos into the g/L it will actually add */
  const impact = (key === "salt_added" && CFG.volume) ? el("div", "band impact") : null;
  function refreshImpact(){
    if (!impact) return;
    const kg = parseFloat(input.value);
    impact.textContent = isNaN(kg) || !kg ? ""
      : S.impact_salt.replace("{delta}", (kg / CFG.volume).toFixed(2))
                     .replace("{volume}", CFG.volume);
  }

  /* When probe values feed the entities anyway (fill_on_record/mirror),
     pre-fill the field so the person sees what will be recorded. */
  if (live && (CFG.linked_mode === "fill_on_record" || CFG.linked_mode === "mirror")
      && live.value >= limit.min && live.value <= limit.max) {
    input.value = Number(live.value).toFixed(decimals);
  }
  function bump(direction){
    let value = parseFloat(input.value);
    if (isNaN(value)) value = parseFloat(input.placeholder) || limit.min;
    value += direction * limit.step;
    value = Math.min(limit.max, Math.max(limit.min, value));
    input.value = value.toFixed(decimals);
    refreshImpact();
  }
  minus.addEventListener("click", () => bump(-1));
  plus.addEventListener("click", () => bump(1));

  box.append(minus, input, unit, plus);
  field.appendChild(box);
  if (note) field.appendChild(note);
  if (impact) {
    field.appendChild(impact);
    input.addEventListener("input", refreshImpact);
    refreshImpact();
  }
  return field;
}

function segmentsField(labelText, key, options, labels, multi){
  const field = el("div", "field");
  field.appendChild(el("label", null, labelText));
  const box = el("div", "segments");
  box.dataset.key = key;
  if (multi) box.dataset.multi = "1";
  options.forEach(option => {
    const button = el("button", null, labels[option] || option);
    button.type = "button";
    button.dataset.v = option;
    button.addEventListener("click", () => {
      if (multi) {
        button.classList.toggle("on");
      } else {
        box.querySelectorAll("button").forEach(other => {
          if (other !== button) other.classList.remove("on");
        });
        button.classList.toggle("on");
      }
    });
    box.appendChild(button);
  });
  field.appendChild(box);
  return field;
}

/* Ideal band check, shared by the form and the status tab */
function rangeStatus(key, value){
  const band = (CFG.ranges || {})[key];
  if (!band || value === undefined || value === null) return null;
  if (value < band.min) return "low";
  if (value > band.max) return "high";
  return "ideal";
}
function bandText(key){
  const band = (CFG.ranges || {})[key];
  return band ? S.report.ideal_band.replace("{min}", band.min).replace("{max}", band.max) : "";
}

function hintOnly(text){
  return el("p", "hint", text);
}


/* ---------- panels per tile ---------- */
function buildPanel(tile){
  const panel = el("div", "panel");
  panel.id = "panel-" + tile;
  const p = S.panels[tile];
  panel.appendChild(el("h3", null, p.title));
  const parts = [];
  if (tile === "water_test") {
    /* Roughly the order of a 7-in-1 strip, the slow monthly readings last.
       Each stepper only exists when its module is enabled (CFG.limits). */
    parts.push(stepperField(p.ph, "ph"));
    parts.push(stepperField(p.free_chlorine, "free_chlorine"));
    parts.push(stepperField(p.total_chlorine, "total_chlorine"));
    parts.push(stepperField(p.total_alkalinity, "total_alkalinity"));
    parts.push(stepperField(p.salt, "salt_level"));
    parts.push(stepperField(p.temperature, "water_temperature"));
    parts.push(stepperField(p.cyanuric_acid, "cyanuric_acid"));
    parts.push(stepperField(p.calcium_hardness, "calcium_hardness"));
    parts.push(hintOnly(p.hint));
  } else if (tile === "chlorinator") {
    parts.push(segmentsField(p.mode, "chlorinator_mode", ["smart", "manual", "boost"], S.modes, false));
    parts.push(stepperField(p.output, "chlorinator_output"));
  } else if (tile === "salt") {
    parts.push(stepperField(p.amount, "salt_added"));
  } else if (tile === "acid_refill") {
    parts.push(segmentsField(p.level, "acid_level", ["full", "three_quarters", "half", "quarter", "empty", "none"], S.acid_levels, false));
  } else if (tile === "cleaning") {
    parts.push(segmentsField(p.what, "cleaning_types", ["vacuum", "waterline", "baskets"], S.cleaning_types, true));
  } else {
    parts.push(hintOnly(p.hint));
  }
  parts.filter(Boolean).forEach(part => panel.appendChild(part));
  return panel;
}

const tilesBox = document.getElementById("tiles");
const panelsBox = document.getElementById("panels");
CFG.tiles.forEach(tile => {
  const button = el("button", "tile");
  button.type = "button";
  button.dataset.tile = tile;
  button.innerHTML =
    '<svg viewBox="0 0 24 24">' + (ICONS[tile] || ICONS.other) + "</svg>" +
    "<span></span>";
  button.querySelector("span").textContent = S.tiles[tile] || tile;
  button.addEventListener("click", () => {
    button.classList.toggle("on");
    const panel = document.getElementById("panel-" + tile);
    panel.classList.toggle("open", button.classList.contains("on"));
  });
  tilesBox.appendChild(button);
  panelsBox.appendChild(buildPanel(tile));
});

/* ---------- value collection ---------- */
function stepperValue(key){
  const box = document.querySelector('.stepper[data-key="' + key + '"]');
  if (!box) return null;
  const value = parseFloat(box.querySelector("input").value);
  return isNaN(value) ? null : value;
}
function segmentValue(key){
  const active = document.querySelector('.segments[data-key="' + key + '"] button.on');
  return active ? active.dataset.v : null;
}
function segmentValues(key){
  const active = document.querySelectorAll('.segments[data-key="' + key + '"] button.on');
  return Array.from(active).map(button => button.dataset.v);
}

/* ---------- submit ---------- */
const sendButton = document.getElementById("send");
sendButton.addEventListener("click", async () => {
  /* The result overlay is shared with the maintenance sheet, which renames
     this button while it owns it. */
  setText("res-back", S.again);
  const selected = Array.from(document.querySelectorAll(".tile.on")).map(
    tile => tile.dataset.tile
  );
  const noteText = document.getElementById("note").value.trim();
  if (selected.length === 0 && !noteText) {
    showResult(false, S.nothing_title, S.nothing_text, "");
    return;
  }

  const person = document.querySelector("#who .chip.on").dataset.v;
  const payload = {
    note: noteText || null,
    version: 2,
    person: person,
    logged_at: loggedAt(),
    categories: selected,
    readings: {
      ph: stepperValue("ph"),
      free_chlorine: stepperValue("free_chlorine"),
      total_chlorine: stepperValue("total_chlorine"),
      total_alkalinity: stepperValue("total_alkalinity"),
      cyanuric_acid: stepperValue("cyanuric_acid"),
      calcium_hardness: stepperValue("calcium_hardness"),
      salt: stepperValue("salt_level"),
      temperature: stepperValue("water_temperature")
    },
    chlorinator: {
      output: stepperValue("chlorinator_output"),
      mode: segmentValue("chlorinator_mode")
    },
    salt: { added_kg: stepperValue("salt_added") },
    acid: { level: segmentValue("acid_level") },
    cleaning: { types: segmentValues("cleaning_types") }
  };

  sendButton.disabled = true;
  setText("send-label", S.saving);

  try {
    const response = await fetch(CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    showResult(true, S.success_title, S.success_text, summaryFor(payload, selected));
  } catch (error) {
    showResult(false, S.error_title, S.error_text, "");
    sendButton.disabled = false;
    setText("send-label", S.save);
  }
});

function summaryFor(payload, selected){
  const stamp = new Date(payload.logged_at).toLocaleString(
    CFG.language === "pt" ? "pt-PT" : CFG.language,
    { dateStyle: "short", timeStyle: "short" }
  );
  const fragments = [];
  selected.forEach(tile => fragments.push("✓ " + (S.tiles[tile] || tile)));
  if (payload.readings.ph !== null) fragments.push(S.panels.water_test.ph + ": " + payload.readings.ph);
  if (payload.readings.free_chlorine !== null) fragments.push(S.panels.water_test.free_chlorine + ": " + payload.readings.free_chlorine + " " + S.units.free_chlorine);
  if (payload.readings.total_chlorine !== null) fragments.push(S.panels.water_test.total_chlorine + ": " + payload.readings.total_chlorine + " " + S.units.total_chlorine);
  if (payload.readings.total_alkalinity !== null) fragments.push(S.panels.water_test.total_alkalinity + ": " + payload.readings.total_alkalinity + " " + S.units.total_alkalinity);
  if (payload.readings.cyanuric_acid !== null) fragments.push(S.panels.water_test.cyanuric_acid + ": " + payload.readings.cyanuric_acid + " " + S.units.cyanuric_acid);
  if (payload.readings.calcium_hardness !== null) fragments.push(S.panels.water_test.calcium_hardness + ": " + payload.readings.calcium_hardness + " " + S.units.calcium_hardness);
  if (payload.readings.salt !== null) fragments.push(S.panels.water_test.salt + ": " + payload.readings.salt + " " + S.units.salt_level);
  if (payload.readings.temperature !== null) fragments.push(S.panels.water_test.temperature + ": " + payload.readings.temperature + " " + S.units.water_temperature);
  if (payload.salt.added_kg !== null) fragments.push(S.tiles.salt + ": " + payload.salt.added_kg + " " + S.units.salt_added);
  if (payload.chlorinator.output !== null) fragments.push(S.panels.chlorinator.output + ": " + payload.chlorinator.output + " " + S.units.chlorinator_output);
  if (payload.chlorinator.mode) fragments.push(S.panels.chlorinator.mode + ": " + S.modes[payload.chlorinator.mode]);
  if (payload.acid.level) fragments.push(S.panels.acid_refill.level + ": " + S.acid_levels[payload.acid.level]);
  if (payload.cleaning.types.length) fragments.push(payload.cleaning.types.map(type => S.cleaning_types[type]).join(", "));
  if (payload.note) fragments.push(S.notes.title + ": " + payload.note);

  const summary = document.createElement("div");
  const header = document.createElement("strong");
  header.textContent = payload.person + " · " + stamp;
  summary.appendChild(header);
  fragments.forEach(text => {
    summary.appendChild(document.createElement("br"));
    summary.appendChild(document.createTextNode(text));
  });
  return summary.innerHTML;
}

function showResult(ok, title, text, summaryHtml){
  const box = document.getElementById("result");
  box.classList.remove("ok", "err");
  box.classList.add("open", ok ? "ok" : "err");
  document.getElementById("res-icon").innerHTML = ok
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#1E9E6A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#E8890C" stroke-width="2.5" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';
  setText("res-title", title);
  setText("res-text", text);
  const summaryBox = document.getElementById("res-summary");
  summaryBox.innerHTML = summaryHtml;
  summaryBox.style.display = summaryHtml ? "block" : "none";
  if (!ok && !summaryHtml) {
    setTimeout(() => box.classList.remove("open"), 2600);
  }
}
</script>
